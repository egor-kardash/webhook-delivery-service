version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - errorlint

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/egor-kardash/webhook-delivery-service)
      custom-order: true
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: false
